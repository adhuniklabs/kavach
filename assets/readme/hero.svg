<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="376" viewBox="0 0 1200 376"
     role="img" aria-labelledby="t d">
  <title id="t">KAVACH - zero-input adversarial security audit for any codebase</title>
  <desc id="d">Left: the KAVACH wordmark, and the line "Point an AI agent at any repo. Get back a signed VAPT-grade report. No config. No stack description." Right: a sample verdict showing certification withheld, 14 Critical, 96 High and 128 Medium findings, and two gate controls marked unproven with five more.</desc>

  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0bd53"/>
      <stop offset="0.55" stop-color="#c9a227"/>
      <stop offset="1" stop-color="#8f6f1c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="376" rx="18" fill="#0b0b0c"/>
  <rect x="0.6" y="0.6" width="1198.8" height="374.8" rx="17.4" fill="none" stroke="#26262b" stroke-width="1.2"/>

  <!-- identity -->
  <g transform="translate(60 0)">
    <text y="58" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20"
          letter-spacing="2.4" fill="#c9a227">ADVERSARIAL SECURITY AUDIT</text>

    <text y="150" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="98" font-weight="700" letter-spacing="1" fill="#f2efe9">KAVACH</text>

    <rect y="176" width="124" height="4" rx="2" fill="url(#brass)"/>

    <text y="228" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="27" fill="#f2efe9">Point an AI agent at any repo.</text>
    <text y="264" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="27" fill="#f2efe9">Get back a signed VAPT-grade report.</text>
    <text y="306" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="25" font-weight="600" fill="#c9a227">No config. No stack description.</text>

    <text y="348" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21"
          fill="#86827c">8 modes · 14 scanners · 518 tests</text>
  </g>

  <!-- real output: the fail-closed gate -->
  <g transform="translate(660 62)">
    <rect width="480" height="256" rx="10" fill="#15151a" stroke="#2c2c32" stroke-width="1.25"/>

    <text x="22" y="40" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21"
          letter-spacing="1.6" fill="#86827c">SAMPLE VERDICT</text>

    <text x="22" y="86" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="34" font-weight="700" fill="#e0685c">CERTIFICATION WITHHELD</text>

    <line x1="0" y1="110" x2="480" y2="110" stroke="#2c2c32" stroke-width="1.25"/>

    <g transform="translate(22 130)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="25">
      <rect width="104" height="42" rx="6" fill="#2a1210" stroke="#7d2f26" stroke-width="1.4"/>
      <text x="52" y="29" text-anchor="middle" fill="#e0685c">C 14</text>
      <rect x="116" width="104" height="42" rx="6" fill="#2a1c10" stroke="#8a5a22" stroke-width="1.4"/>
      <text x="168" y="29" text-anchor="middle" fill="#dc9b4e">H 96</text>
      <rect x="232" width="116" height="42" rx="6" fill="#232014" stroke="#6f6427" stroke-width="1.4"/>
      <text x="290" y="29" text-anchor="middle" fill="#cbbf58">M 128</text>
    </g>

    <!-- the motif: a control is proven or it is not -->
    <g transform="translate(22 196)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22">
      <g>
        <rect y="1" width="18" height="18" rx="4" fill="none" stroke="#7d2f26" stroke-width="1.8"/>
        <path d="M4.4 5.4 L13.6 14.6 M13.6 5.4 L4.4 14.6" stroke="#e0685c" stroke-width="1.8" stroke-linecap="round"/>
        <text x="32" y="16" fill="#b3aea7">billing_server_side_enforced</text>
      </g>
      <g transform="translate(0 32)">
        <rect y="1" width="18" height="18" rx="4" fill="none" stroke="#7d2f26" stroke-width="1.8"/>
        <path d="M4.4 5.4 L13.6 14.6 M13.6 5.4 L4.4 14.6" stroke="#e0685c" stroke-width="1.8" stroke-linecap="round"/>
        <text x="32" y="16" fill="#b3aea7">authz_on_every_object</text>
        <text x="436" y="16" text-anchor="end" fill="#6f6b66">+5 more</text>
      </g>
    </g>
  </g>
</svg>
