[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kavach-audit"
version = "0.1.0"
description = "Zero-input adversarial security audit - deterministic recon + docker-scanner sweep + canonical findings, scoring, gate, and multi-format reports."
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Adhunik Labs" }]
keywords = ["security", "sast", "audit", "vapt", "scanner", "sarif", "supply-chain", "llm-security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "PyYAML>=6",
  "filelock>=3",
]

# reportlab is the only optional dependency, and it is optional on purpose: it is a pure pip
# install with no system libraries behind it, so `kavach-audit[report]` works in a bare VM.
# Markdown, JSON, SARIF and HTML render without it; only `--format pdf` requires it.
[project.optional-dependencies]
report = ["reportlab>=4.0"]

[project.scripts]
kavach = "kavach.cli:main"

[project.urls]
Homepage = "https://github.com/adhuniklabs/kavach"
Source = "https://github.com/adhuniklabs/kavach"

[tool.setuptools.packages.find]
where = ["."]
include = ["kavach*"]

[tool.setuptools.package-data]
kavach = ["scanners/assets/*.yml"]
